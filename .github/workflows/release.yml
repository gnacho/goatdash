name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Write version.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "{\"version\":\"${VERSION}\"}" > version.json

      - name: Create release tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          TMP=$(mktemp -d)
          mkdir "${TMP}/goatdash"
          # theme.js, app.js, fixtures.js, sw.js y update-check.js los genera
          # el paso de build desde src/*.ts: no se versionan.
          cp -r index.html styles.css theme.js app.js fixtures.js sw.js update-check.js version.json \
            assets robots.txt LICENSE LICENSE.world-map "${TMP}/goatdash/"
          tar -czf "dist/goatdash-${VERSION}.tar.gz" -C "${TMP}" goatdash

      - name: Generate checksums
        working-directory: dist
        run: sha256sum goatdash-*.tar.gz > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
